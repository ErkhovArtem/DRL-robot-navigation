[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dog-path-planning"
version = "0.1.0"
description = "Hierarchical SAC navigation for the Unitree A1 quadruped in MuJoCo"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [{ name = "Artem Erkhov" }]
dependencies = [
  "mujoco>=3.2,<4",
  "numpy>=1.24,<3",
  "PyYAML>=6,<7",
  "tensorboard>=2.14",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
mjx = [
  "jax>=0.4.25",
  "mujoco-mjx>=3.2,<4",
]
onnx = [
  "onnx>=1.16",
  "onnxruntime>=1.18",
]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
