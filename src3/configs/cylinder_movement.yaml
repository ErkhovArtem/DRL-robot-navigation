# Configuration for cylinder circular movement
# Each cylinder moves in a circle around its initial position (from scene.xml)
# 
# Parameters for each cylinder:
#   radius: radius of the circle in meters (distance from center to cylinder)
#   angular_speed: angular speed in radians per second
#     - positive values = counterclockwise rotation
#     - negative values = clockwise rotation
#     - typical range: -1.0 to 1.0 rad/s (adjust based on desired speed)
#
# Example: radius=0.5m, angular_speed=0.3 rad/s means:
#   - Cylinder moves in a circle with radius 0.5m
#   - Completes one full rotation in ~21 seconds (2*pi/0.3)
#   - Tangential speed = 0.5 * 0.3 = 0.15 m/s

cylinder_red_body:
  radius: 0.5      # meters - circle radius
  angular_speed: 0.4  # rad/s - counterclockwise

cylinder_green_body:
  radius: 0.9      # meters
  angular_speed: -0.4  # rad/s - clockwise

cylinder_blue_body:
  radius: 0.6      # meters
  angular_speed: 0.5  # rad/s - counterclockwise

cylinder_yellow_body:
  radius: 0.3      # meters
  angular_speed: -0.6  # rad/s - clockwise

cylinder_magenta_body:
  radius: 0.7      # meters
  angular_speed: 0.4  # rad/s - counterclockwise

