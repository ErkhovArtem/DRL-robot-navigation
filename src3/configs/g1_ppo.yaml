# 
policy_path: "pre_train/g1/motion.pt"
xml_path: "g1_description/scene.xml"

# Total simulation time
simulation_duration: 60.0
# Simulation time step
simulation_dt: 0.002
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10

kps: [100, 100, 100, 150, 40, 40, 100, 100, 100, 150, 40, 40]
kds: [2, 2, 2, 4, 2, 2, 2, 2, 2, 4, 2, 2]

default_angles: [-0.1,  0.0,  0.0,  0.3, -0.2, 0.0, 
                  -0.1,  0.0,  0.0,  0.3, -0.2, 0.0]

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [1.8, 1.8, 0.25]
num_actions: 12
num_obs: 47

cmd_init: [0, 0, 0]

# Reward weights for path planning
reward_weights:
  reached: 100.0           # Reward for reaching target (given once, episode ends)
  collision: -100.0        # Penalty for collision (episode ends)
  obstacle: -5           # Penalty for being close to obstacle
  obstacle_threshold: 1.0  # Threshold for obstacle penalty (meters)
  progress: 30.0            # Reward per meter of progress toward target (prev_distance - distance)
  vy_penalty: -2          # Penalty for lateral velocity (sideways movement)
  vx_backward_penalty: -2 # Penalty for backward velocity (negative vx)
  reached_threshold: 0.2    # Distance threshold for reaching target (meters)

# PPO hyperparameters
ppo:
  lr: 3e-4                # Learning rate for both actor and critic
  gamma: 0.99             # Discount factor
  gae_lambda: 0.95        # GAE lambda parameter
  clip_epsilon: 0.2       # PPO clipping parameter
  value_coef: 0.5         # Value loss coefficient
  entropy_coef: 0.01      # Entropy bonus coefficient
  max_grad_norm: 0.5      # Maximum gradient norm for clipping
  update_epochs: 100        # Number of update epochs per rollout
  batch_size: 256           # Batch size for updates

# Obstacle generator configuration
obstacle_generator:
  regeneration_interval: 10  # Regenerate obstacles every N episodes
  
  # Cube configuration
  cubes:
    count_min: 0            # Minimum number of cubes
    count_max: 2             # Maximum number of cubes
    size_x_min: 0.1          # Minimum half-width (X dimension) in meters
    size_x_max: 0.5          # Maximum half-width (X dimension) in meters
    size_y_min: 0.1          # Minimum half-length (Y dimension) in meters
    size_y_max: 0.5          # Maximum half-length (Y dimension) in meters
    size_z: 1.0              # Fixed half-height (Z dimension) in meters
  
  # Cylinder configuration
  cylinders:
    count_min: 0             # Minimum number of cylinders
    count_max: 2              # Maximum number of cylinders
    radius_min: 0.1           # Minimum radius in meters
    radius_max: 0.5           # Maximum radius in meters
    height: 2.0               # Fixed full height in meters
  
  # Position constraints
  position:
    min_margin: 1.5          # Minimum margin from room boundaries in meters

